# Portainer: Stacks → Add stack → Repository, point it at this repo, compose path "docker-compose.yml".
# Optional stack environment variables are listed in README.md ("Deploy with Docker / Portainer").

name: festival-broadcaster

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: festival-broadcaster:latest
    container_name: festival-broadcaster
    restart: unless-stopped
    ports:
      # Reach the app at http://<server-ip>:3005. Set PUBLISH_PORT to use another host port.
      # (Inside the container the app always listens on 3000.)
      - "${PUBLISH_PORT:-3005}:3000"
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      BAILEYS_LOG_LEVEL: ${BAILEYS_LOG_LEVEL:-silent}
    volumes:
      # Database, WhatsApp login keys and uploaded media. Back this volume up; keep it private.
      - festival-data:/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  festival-data:
